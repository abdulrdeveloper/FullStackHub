<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1 Million Checkboxes</title>
    <style>
      body {
        font-family: sans-serif;
      }
      #container input {
        width: 24px;
        height: 24px;
      }
    </style>
  </head>
  <body>
    <h1>Checkboxes</h1>
    <div id="container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const container = document.getElementById('container');
      const CHECKBOX_COUNT = 100;

      socket.on('server:error', (data) => {
        const errorMessage = data.error;
        alert(errorMessage);
      });

      socket.on('server:checkbox:change', (data) => {
        console.log(`Socker Server Event`, data);
        const { index, checked } = data;

        const input = document.getElementById(`checkbox-${index}`);
        if (input) {
          input.checked = checked;
        }
      });

      window.addEventListener('load', async () => {
        const response = await fetch('/checkboxes', { method: 'GET' });
        const data = await response.json();

        if (data && data.checkboxes) {
          data.checkboxes.forEach((checked, index) => {
            const input = document.createElement('input');
            input.type = 'checkbox';
            input.id = `checkbox-${index}`;
            input.checked = checked;
            input.addEventListener('change', (event) => {
              const checked = event.target.checked;
              console.log('Checkbox Changed', { index, checked });
              socket.emit('client:checkbox:change', { index, checked });
            });
            container.appendChild(input);
          });
        }
      });
    </script>
  </body>
</html>
