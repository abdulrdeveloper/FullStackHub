<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn Tailwind</title>
  </head>
  <body class="bg-slate-100 text-slate-800">
    <main class="mx-auto max-w-6xl px-4 py-10 sm:px-6 lg:px-8">
      <section class="rounded-2xl bg-white p-6 shadow-lg sm:p-8 lg:p-10">
        <h1 class="text-3xl font-bold text-slate-900 sm:text-4xl">Tailwind Practice</h1>
        <p class="mt-4 text-base text-slate-600 sm:text-lg">A simple demo for learning Tailwind utilities.</p>
        <div class="mt-8 grid gap-6 md:grid-cols-2">
          <div class="rounded-xl border border-slate-200 bg-slate-50 p-6">
            <h2 class="text-xl font-semibold">Layout</h2>
            <p class="mt-2 text-sm text-slate-600">Use spacing, colors, and containers to shape the page.</p>
          </div>
          <div class="rounded-xl border border-slate-200 bg-slate-50 p-6">
            <h2 class="text-xl font-semibold">Typography</h2>
            <p class="mt-2 text-sm text-slate-600">Adjust font size and weight with utility classes.</p>
          </div>
        </div>
        <div class="mt-8 rounded-xl bg-slate-900 p-6 text-slate-100">
          <h3 class="text-lg font-semibold">Practice note</h3>
          <p class="mt-2 text-sm">Combine utility classes to build polished components quickly.</p>
        </div>
      </section>
    </main>
  </body>
</html>
