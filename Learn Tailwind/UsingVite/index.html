<!doctype html>
<html lang="en">
  <head>

  </head>

            <p class="mt-2 text-sm text-slate-600">Use spacing, colors, and containers to shape the page.</p>

          <div class="rounded-xl border border-slate-200 bg-slate-50 p-6">
