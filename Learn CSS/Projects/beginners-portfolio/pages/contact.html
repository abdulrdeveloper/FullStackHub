    <style>
        body {
            margin: 0%;
            height: 100vh;
            overflow-x: hidden;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(90deg, #0b0d11, #141924);
        }


        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("../assets/images/freepik__adjust__38386.png");
            background-size: 100%;
            /* image apni original size me */
            background-repeat: repeat;
            /* choti image repeat hoke poora cover karegi */
            background-position: center;
            filter: brightness(0.1);
            z-index: -10;
        }


        header {
            display: flex;
            padding-top: 15px;

        .navigation {
            display: flex;
            gap: 6px;
            position: fixed;
            left: 47.5%;
            top: 0%;
            flex-wrap: wrap;
            padding: 15px 10px;
            border-bottom-right-radius: 30px;
            border-bottom-left-radius: 30px;
            background-color: rgba(0, 0, 0, 0.212);
        }

        .navigation a {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.801);
            text-decoration: none;
            padding: 6px 18px 9px 18px;
            transition: all 0.3s ease-in-out;
            border-radius: 3%;
            position: relative;
        }

        .navigation a::before {
            content: "";
            position: absolute;
            width: 60%;
            top: 85%;
            left: 20%;
            bottom: 0;
            right: 0;
            height: 5%;
            transform-origin: center;
            background: linear-gradient(90deg, #9b64ff, #ff7bb6);
            transform: scaleX(0);
            transition: transform 0.3s ease-in-out;

        }

        .navigation a:hover::before {
            transform: scaleX(1);
        }

        .navigation a:hover {
            background-color: transparent;
            background: linear-gradient(380deg, #ff4d4d, #ff7bb6, #9b64ff, #5ac8fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #contactacolor {
            background: linear-gradient(380deg, #ff4d4d, #ff7bb6, #9b64ff, #5ac8fa);

            display: flex;
        }

        @keyframes slideIn {

            }
        }

        main span {

            text-decoration: none;
        }

            color: transparent;
        }

        p {

<script>
    const hamburger = document.querySelector('.fa-bars-staggered');
    const cross = document.getElementById('cross');
    const nav = document.querySelector('.navigation');

    // Initial state
    cross.style.display = 'none';

    hamburger.addEventListener('click', () => {
        nav.style.transform = 'translateY(0px)';
        hamburger.style.display = 'none';
        cross.style.display = 'block';

        // Show nav links
        document.querySelectorAll('.navigation a').forEach(link => {
            link.style.display = 'block';
            link.style.visibility = 'visible';
            link.style.opacity = '1';
        });
    });

    cross.addEventListener('click', () => {
        nav.style.transform = 'translateY(-500px)';
        hamburger.style.display = 'block';
        cross.style.display = 'none';

        // Hide nav links
        document.querySelectorAll('.navigation a').forEach(link => {
            link.style.display = 'none';
            link.style.visibility = 'hidden';
            link.style.opacity = '0';
        });
    });

    document.addEventListener('contextmenu', event => event.preventDefault());

    // Disable common DevTools shortcuts
    document.onkeydown = function (e) {
        if (e.keyCode == 123) { // F12
            return false;
        }
        if (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) {
            return false; // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C
        }
        if (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83)) {
            return false; // Ctrl+U (View Source) / Ctrl+S (Save)
        }
    };
</script>
